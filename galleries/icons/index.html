<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../">
    <title>アイコン特典ギャラリー | Nico</title>
    <link rel="stylesheet" href="galleries/icons/icon-gallery.css">
</head>
<body>
    <main>
        <a class="back-link" href="./">Nico公式ホームへ</a>

        <section class="hero" aria-labelledby="page-title">
            <img src="assets/icon_gallery/icon_gallery_cover_20260616.png" alt="アイコン特典ギャラリー">
            <div class="hero-body">
                <h1 id="page-title">アイコン特典ギャラリー</h1>
                <p class="lead">ColorSingで受け取れるアイコン特典をまとめた場所です。見たい特典をタップすると、それぞれの保存ページへ移動します。</p>
            </div>
        </section>

        <nav class="category-list" aria-label="アイコン特典メニュー">
            <a class="category-card" href="galleries/icons/utaoshi/">
                <img src="btn_cat1.png" alt="アイコンギャラリー 歌推しはこちら">
                <span class="category-copy">
                    <strong>アイコンギャラリー<br>歌推しはこちら</strong>
                    <span>歌推し特典を受け取ってね</span>
                </span>
            </a>
            <a class="category-card" href="galleries/icons/5k/">
                <img src="btn_cat2.png" alt="5K特典はこちら">
                <span class="category-copy">
                    <strong>5K特典はこちら</strong>
                    <span>応援ありがとうのプレゼント</span>
                </span>
            </a>
            <a class="category-card" href="galleries/icons/membership/">
                <img src="assets/membership_6months/member_ship_6months_gallery_01_20260602.jpg" alt="6ヶ月Membership特典はこちら">
                <span class="category-copy">
                    <strong>6ヶ月Membership特典</strong>
                    <span>継続ありがとうの特別カード</span>
                </span>
            </a>
            <a class="category-card" href="galleries/icons/gundam-2026-06-13/">
                <img src="assets/icon_gallery/gundam-special-frame-20260613/cover.png" alt="ガンダム集計祭りスペシャルアイコンフレーム特典はこちら">
                <span class="category-copy">
                    <strong>ガンダム集計祭り特典</strong>
                    <span>スペシャルアイコンフレーム</span>
                </span>
            </a>
        </nav>
    </main>

    <script>
        const oldHashRoutes = {
            utaoshi: "galleries/icons/utaoshi/",
            fivek: "galleries/icons/5k/",
            membership: "galleries/icons/membership/",
            gundam: "galleries/icons/gundam-2026-06-13/"
        };
        const oldKey = location.hash.replace("#", "");
        if (oldHashRoutes[oldKey]) {
            location.replace(oldHashRoutes[oldKey]);
        }
    </script>
</body>
</html>
