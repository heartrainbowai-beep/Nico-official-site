    <link rel="stylesheet" href="galleries/icons/icon-gallery.css">
    <style>
        .reward-section {
            display: grid;
            gap: 14px;
        }

        .reward-section + .reward-section {
            margin-top: 28px;
        }

        .reward-heading {
            margin: 0;
            text-align: center;
            font-size: clamp(20px, 5.8vw, 28px);
            line-height: 1.35;
            color: #fff8fd;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.98);
        }

        .reward-note {
            margin: 0;
            text-align: center;
            color: #fff4fb;
            font-size: 13px;
            line-height: 1.7;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(173, 58, 135, 0.7);
        }

        .reward-stack {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 22px;
            justify-items: center;
        }

        .reward-card {
            width: min(100%, 680px);
            margin: 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.86);
            border-radius: 24px;
            background:
                radial-gradient(circle at 50% 42%, rgba(255, 127, 197, 0.16), transparent 38%),
                #13000d;
            box-shadow: 0 14px 30px rgba(129, 62, 132, 0.24);
        }

        .reward-card img {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
        }

        .reward-card figcaption {
            padding: 10px 12px 8px;
            text-align: center;
            color: #fff;
            font-size: clamp(15px, 4vw, 20px);
            line-height: 1.45;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(255, 105, 180, 0.9);
        }

        .reward-save {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            margin: 0 auto 14px;
            padding: 9px 16px;
            border: 2px solid rgba(255, 255, 255, 0.86);
            border-radius: 999px;
            color: #fff;
            background: linear-gradient(135deg, #ff65b4, #87c7ff);
            box-shadow: 0 8px 18px rgba(224, 73, 149, 0.24);
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
        }

        .cover-card {
            width: min(100%, 320px);
            margin: 0 auto;
        }

        .cover-card img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 20px;
        }

        .cover-card figcaption {
            padding-top: 9px;
            text-align: center;
            color: #fff;
            font-size: 13px;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(255, 105, 180, 0.9);
        }
    </style>
</head>
