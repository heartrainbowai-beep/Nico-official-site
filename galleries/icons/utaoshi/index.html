<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../../">
    <title>アイコンギャラリー 歌推しはこちら | Nico</title>
    <link rel="stylesheet" href="galleries/icons/icon-gallery.css">
</head>
<body>
    <main>
        <a class="back-link" href="galleries/icons/">アイコン特典ギャラリーへ戻る</a>

        <section class="icon-panel" aria-label="1K歌推し特典">
            <section class="icon-section" aria-labelledby="current-utaoshi-title">
                <h2 id="current-utaoshi-title" class="icon-section-heading">2026年7月からの歌推し<br>1K歌推しありがとう</h2>
                <p class="icon-section-subcopy">2026.07.01 からの現役1K歌推し画像です。</p>
                <div class="icon-grid icon-grid-single">
                    <div class="icon-item">
                        <a href="assets/icon_gallery/utaoshi-1k-current/utaoshi_1k_current_20260701.jpg" download="nico_utaoshi_1k_current_20260701.jpg">
                            <img src="assets/icon_gallery/utaoshi-1k-current/utaoshi_1k_current_20260701.jpg" alt="今月の1K歌推しありがとう画像">
                        </a>
                        <div class="icon-caption">2026.07.01 / 1K歌推しありがとう</div>
                        <a class="save-link" href="assets/icon_gallery/utaoshi-1k-current/utaoshi_1k_current_20260701.jpg" download="nico_utaoshi_1k_current_20260701.jpg">画像を保存する</a>
                    </div>
                </div>
            </section>

            <section class="icon-section" aria-labelledby="archive-utaoshi-title">
                <h2 id="archive-utaoshi-title" class="icon-section-heading">2026年6月までの1K歌推し特典</h2>
                <p class="icon-section-subcopy">ここをタップすると、これまでの1K歌推しありがとう画像を見られます。</p>
                <div class="icon-grid icon-grid-single">
                    <a class="icon-item waiting-card waiting-link" href="galleries/icons/utaoshi-history/">
                        <span class="waiting-badge">1K歌推しアーカイブ</span>
                        <p class="waiting-copy">2026年6月までの<br>1K歌推しはこちら</p>
                        <p class="waiting-subcopy">歴代1K歌推し特典ページを開く</p>
                    </a>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
